<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSxhVGHGSeEzTQ1EXRu42bC4o1MrJBVgY8BgA&s" type="image/png">
    <link rel="stylesheet" href="./style.css">
    <script src="https://kit.fontawesome.com/d6128b37c4.js" crossorigin="anonymous"></script>
    <title>TODOs</title>
</head>
<body>
    <div class="container">
        <h2>Your ToDo's</h2>

        <div class="task-table-container">
            
            <table class="task-table" spellcheck="true">
                <thead class="task-table-head">
                    <tr>
                        <th>SNO:</th>
                        <th>Active Tasks</th>
                        <th>Update Here</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody class="task-table-content" id="task-table-content">
                    <tr class="task-creation" id="for-active-tasks">
                        <td></td>
                        <td class="task-input">
                            <input type="text" placeholder="Click here - Task creation" id="task-input" />
                        </td>
                        <td></td>
                        <td>
                            <div class="actions" id="save">
                                <button title="Save" disabled><i class="fa-duotone fa-solid fa-circle-check"></i></button>
                            </div>
                        </td>
                    </tr>
                    <tr id="par-line">
                        <th>SNO:</th>
                        <th>Completed Tasks</th>
                        <th>Revert Updation</th>
                        <th>Actions</th>
                    </tr>


                    
                </tbody>
            </table>

        </div>
    </div>
    <script type="module" src="./script.js"></script>
</body>
</html>
